name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check
        shell: bash
        run: |
          for f in $(git ls-files 'src/*.js' 'src/**/*.js'); do node --check "$f" || exit 1; done
      - name: No undefined names
        run: npm run check:names
      - name: Native code compiles
        run: npm run check:native
      - run: npm test
