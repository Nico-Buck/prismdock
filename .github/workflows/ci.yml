name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check
        shell: bash
        run: |
          for f in $(git ls-files 'src/*.js' 'src/**/*.js'); do node --check "$f" || exit 1; done
      - name: Native code compiles
        run: npm run check:native
      - run: npm test
